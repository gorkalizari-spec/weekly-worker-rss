name: Actualizar RSS

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: weekly-worker-feeds
  cancel-in-progress: false

jobs:
  actualizar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Descargar la rama de publicación
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Preparar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests
      - name: Actualizar los canales
        id: update
        continue-on-error: true
        run: python update.py
      - name: Publicar los canales y su estado
        if: steps.update.outcome == 'success' || steps.update.outcome == 'failure'
        run: |
          # El primer intento puede haber generado únicamente la fecha de reintento.
          shopt -s nullglob
          outputs=(feeds/*.xml state/*.json)
          if (( ${#outputs[@]} > 0 )); then
            git add -- "${outputs[@]}"
          fi
          # Incluye la retirada del aviso de reintento tras una actualización correcta.
          if git ls-files --error-unmatch -- state/retry.json >/dev/null 2>&1; then
            git add -u -- state/retry.json
          fi
          if git diff --cached --quiet; then
            echo "Los canales están al día."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Actualizar los canales de Weekly Worker'
          git push origin HEAD:main
      - name: Señalar la actualización incompleta
        if: steps.update.outcome == 'failure'
        run: exit 1
